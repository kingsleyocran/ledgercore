name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore LedgerCore.slnx

      - name: Build
        run: dotnet build LedgerCore.slnx -c Release --no-restore

      - name: Test
        run: dotnet test LedgerCore.slnx -c Release --no-build -v minimal

      - name: Pack
        run: |
          dotnet pack src/LedgerCore.Application/LedgerCore.Application.csproj -c Release --no-build -o ./nupkgs
          dotnet pack src/LedgerCore.Infrastructure/LedgerCore.Infrastructure.csproj -c Release --no-build -o ./nupkgs

      - name: Publish to NuGet (Trusted Publishing)
        run: |
          OIDC_TOKEN=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value')
          for pkg in ./nupkgs/*.nupkg; do
            dotnet nuget push "$pkg" --source https://api.nuget.org/v3/index.json --api-key "$OIDC_TOKEN"
          done
